[project]
name = "valutatrade-hub"
version = "0.3.0"
description = "Educational virtual currency wallet with users, portfolios and a CLI"
readme = "README.md"
authors = [{ name = "David Zakharyan" }]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "requests>=2.34.2",
]

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:main"
valutatrade-parser = "valutatrade_hub.parser_service.scheduler:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "valutatrade_hub"
module-root = ""
source-include = ["main.py", "Makefile", "tests/**", "docs/**"]

[dependency-groups]
dev = ["ruff>=0.16.10"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.valutatrade]
data_dir = "data"
users_file = "users.json"
portfolios_file = "portfolios.json"
rates_file = "rates.json"
rates_ttl_seconds = 300
default_base_currency = "USD"
log_file = "logs/actions.log"
log_format = "json"
log_level = "INFO"
log_max_bytes = 1048576
log_backup_count = 3
